name: Validate marketplace

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python3 tools/validate.py
      - run: python3 -m unittest discover -s plugins/japanese-math-skills/skills/write-japanese-math/scripts/tests -v
      - run: python3 plugins/japanese-math-skills/skills/write-japanese-math/scripts/corpus.py --verify
      - run: python3 plugins/japanese-math-skills/skills/write-japanese-math/scripts/rebuild_corpus.py --check
      - run: node plugins/japanese-math-skills/viewer/tests/purpose-filter.cjs
